name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Graph
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: piush365
          MAX_REPOS: "10"
          SETTING_JSON: profile/3d-contrib-settings.json

      - name: Find and move 3D graph
        run: |
          echo "=== Root directory ==="
          ls -la
          echo ""
          echo "=== All SVG files in workspace ==="
          find $GITHUB_WORKSPACE -name "*.svg" -not -path "*/.git/*" 2>/dev/null
          echo ""
          mkdir -p profile
          SVG=$(find $GITHUB_WORKSPACE -maxdepth 1 -name "*.svg" 2>/dev/null | head -1)
          if [ -z "$SVG" ]; then
            echo "ERROR: No SVG found at workspace root"
            exit 1
          fi
          echo "Moving $SVG → profile/profile-3d-contrib.svg"
          mv "$SVG" profile/profile-3d-contrib.svg

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update 3D contribution graph"
          branch: main
